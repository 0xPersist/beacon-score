[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-score"
version = "1.0.0"
description = "Multi-signal C2 beacon detection from Zeek logs or PCAP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["security", "network", "C2", "beacon", "detection", "zeek", "threat-hunting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# pyyaml is the only hard dependency — needed for default config format.
# rich is optional: terminal output degrades gracefully to plain text without it.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0.0"]
toml = ["tomli>=2.0.0; python_version < '3.11'"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "rich>=13.0.0",
]
all = [
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
beacon-score = "beacon_score.cli:main"

[project.urls]
Homepage = "https://github.com/0xPersist/beacon-score"
Repository = "https://github.com/0xPersist/beacon-score"
Issues = "https://github.com/0xPersist/beacon-score/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["beacon_score*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
